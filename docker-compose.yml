services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-template
      - backend-pipecat
      - backend-template

  frontend-template:
    build:
      context: ./frontend-template
    volumes:
      - ./frontend-template:/app
    # Set base path for vite so assets load correctly when mounted under /template/
    command: npm run dev -- --host --base=/template/
    environment:
      - VITE_API_URL=/api/template


  frontend-pipecat:
    build:
      context: ./frontend-pipecat
    volumes:
      - ./frontend-pipecat:/app
    # Set base path for vite so assets load correctly when mounted under /pipecat/
    command: npm run dev -- --host --base=/pipecat/
    environment:
      - VITE_API_URL=/api/pipecat

  backend-template:
    build:
      context: ./backend-template
    volumes:
      - ./backend-template:/app
    environment:
      - APP_ENV=development

  backend-pipecat:
    build:
      context: ./backend-pipecat
    ports:
      - "7860:7860"
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - WHISPER_MODEL=${WHISPER_MODEL:-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-float16}
      - HF_HOME=/app/models
    volumes:
      - ./backend-pipecat/models:/app/models
      - ./backend-pipecat/src:/app/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
