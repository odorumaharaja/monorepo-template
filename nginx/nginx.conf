events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Frontend Admin (served by Vite Dev Server or Nginx based on docker-compose setup)
        location /admin/ {
            proxy_pass http://frontend-admin:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Frontend User
        location /user/ {
            proxy_pass http://frontend-user:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Backend Admin API
        location /api/admin/ {
            proxy_pass http://backend-admin:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend User API
        location /api/user/ {
            proxy_pass http://backend-user:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect root to /user/ or whatever is appropriate
        location = / {
            return 301 /user/;
        }
    }
}
