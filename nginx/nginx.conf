events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        absolute_redirect off;

        # Frontend Template (served by Vite Dev Server or Nginx based on docker-compose setup)
        location /template/ {
            proxy_pass http://frontend-template:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }


        # Frontend User
        location /pipecat/ {
            proxy_pass http://frontend-pipecat:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Backend Template API
        location /api/template/ {
            proxy_pass http://backend-template:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Pipecat API & WebUI
        location = /api/pipecat {
            return 301 /api/pipecat/;
        }

        location /api/pipecat/ {
            proxy_pass http://backend-pipecat:7860/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect root to /template/ or whatever is appropriate
        location = / {
            return 301 /template/;
        }
    }
}
