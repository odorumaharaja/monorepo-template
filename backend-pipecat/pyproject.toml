[project]
name = "pipecat-whisper-demo"
version = "0.1.0"
description = "Pipecat and faster-whisper real-time WebUI speech recognition sample"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[whisper,websocket]>=1.11.0",
    "faster-whisper>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]